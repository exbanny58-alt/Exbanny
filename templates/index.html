<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayzM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Верхняя матовая панель -->
    <header class="top-panel">
        <div class="top-panel-left">
            <div class="logo">
                <span class="dayz"></span><span class="m"></span>
            </div>

            <nav class="settings-subnav" id="settingsSubnav">
                <button class="subnav-tab active" data-settings-tab="general">Общие</button>
                <button class="subnav-tab" data-settings-tab="colors">Цвета</button>
                <button class="subnav-tab" data-settings-tab="effects">Эффекты</button>
            </nav>
        </div>

        <div class="top-panel-right">
            <button class="music-btn" title="Музыкальный плеер">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                    <path d="M9 9l12-2"/>
                </svg>
            </button>
            <button class="settings-btn" title="Настройки"></button>
        </div>
    </header>

    <!-- Основной контейнер -->
    <div class="main-container">

        <!-- Левая панель -->
        <aside class="side-panel">
            <nav class="side-tabs">
                <!-- Вкладки генерируются через JS -->
            </nav>
        </aside>

        <!-- Контент -->
        <main class="content-area" id="content">
            <!-- Контент подгружается через JS -->
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/loader.js') }}"></script>
    <script src="{{ url_for('static', filename='js/effects.js') }}"></script>
    <script src="{{ url_for('static', filename='js/color-picker.js') }}"></script>
    <script src="{{ url_for('static', filename='js/player.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
