<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayzM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/transitions.css') }}">
    <style>
        :root {
            --accent: {{ css_vars['--accent'] }};
            --accent-dim: {{ css_vars['--accent-dim'] }};
            --accent-bg: {{ css_vars['--accent-bg'] }};
            --accent-glow: {{ css_vars['--accent-glow'] }};
            --accent-glow-strong: {{ css_vars['--accent-glow-strong'] }};
            --accent-glow-size: {{ css_vars['--accent-glow-size'] }};
            --loader-color: {{ css_vars['--loader-color'] }};
        }
    </style>
</head>
<body>
    <!-- Верхняя панель -->
    <header class="top-panel">
        <div class="top-panel-left">
            <div class="logo">
                <span class="dayz">Dayz</span><span class="m">M</span>
            </div>
            <nav class="settings-subnav" id="settingsSubnav">
                <button class="subnav-tab active" data-settings-tab="general">Общие</button>
                <button class="subnav-tab" data-settings-tab="colors">Цвета</button>
                <button class="subnav-tab" data-settings-tab="effects">Эффекты</button>
                <button class="subnav-tab" data-settings-tab="paths">Пути</button>
                <button class="subnav-tab" data-settings-tab="database">БД</button>  <!-- ← НОВОЕ -->
            </nav>
        </div>

        <div class="top-panel-right">
            <button class="music-btn" title="Музыкальный плеер">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                    <path d="M9 9l12-2"/>
                </svg>
            </button>
            <button class="settings-btn" title="Настройки">
                <svg viewBox="0 0 24 24" fill="none" stroke="#7d827d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Основной контейнер -->
    <div class="main-container">
        <!-- Левая панель -->
        <aside class="side-panel">
            <nav class="side-tabs">
                {% for page in pages %}
                <button class="side-tab" data-page-id="{{ page.id }}">
                    <span class="tab-icon">{{ page.icon|safe }}</span>
                    {{ page.name }}
                </button>
                {% endfor %}
            </nav>
        </aside>

        <!-- Контент -->
        <main class="content-area" id="content">
            {{ home_page.content|safe if home_page else '' }}
        </main>
    </div>

    <style>
        :root {
            --accent: {{ css_vars['--accent'] }} !important;
            --accent-dim: {{ css_vars['--accent-dim'] }} !important;
            --accent-bg: {{ css_vars['--accent-bg'] }} !important;
            --accent-glow: {{ css_vars['--accent-glow'] }} !important;
            --accent-glow-strong: {{ css_vars['--accent-glow-strong'] }} !important;
            --accent-glow-size: {{ css_vars['--accent-glow-size'] }} !important;
            --loader-color: {{ css_vars['--loader-color'] }} !important;
        }
    </style>

    <!-- Передаём настройки в JS через JSON-блок -->
    <script id="initial-state" type="application/json">
        {
            "colors": {{ colors|tojson }},
            "effect": {{ effect|tojson }}
        }
    </script>
    <script>
        const stateScript = document.getElementById('initial-state');
        try {
            window.__INITIAL_STATE__ = JSON.parse(stateScript.textContent);
            console.log('✅ Initial state loaded:', window.__INITIAL_STATE__);
        } catch (e) {
            console.error('❌ Failed to parse initial state:', e);
            window.__INITIAL_STATE__ = {
                colors: { accent: '#7acc7a', glowIntensity: 50 },
                effect: 'fade'
            };
        }
    </script>

    <!-- БИБЛИОТЕКИ -->
    <script src="{{ url_for('static', filename='js/loader.js') }}"></script>
    <script src="{{ url_for('static', filename='js/effects.js') }}"></script>
    <script src="{{ url_for('static', filename='js/color-picker.js') }}"></script>
    <script src="{{ url_for('static', filename='js/player.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>

    <!-- APP -->
    <script src="{{ url_for('static', filename='js/app/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app/init.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app/navigation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app/settings.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app/player.js') }}"></script>

</body>
</html>
